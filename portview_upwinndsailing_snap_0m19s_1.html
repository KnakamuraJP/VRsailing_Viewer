var canvas = document.getElementById("c");
var hint = document.getElementById("hint");
var loading = document.getElementById("loading");
var fovRange = document.getElementById("fov-range");
var fovVal = document.getElementById("fov-val");

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 0);

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

var geometry = new THREE.SphereGeometry(500, 64, 32);
geometry.scale(-1, 1, 1);
var material = new THREE.MeshBasicMaterial({ color: 0x000000 });
var sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

/* --- State --- */
var lon = 0, lat = 0;
var isDragging = false;
var prevX = 0, prevY = 0;
var hintTimer = null;

/* --- Load image --- */
var loader = new THREE.TextureLoader();
loader.load(IMAGE_URI, function(texture) {
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    sphere.material.dispose();
    sphere.material = new THREE.MeshBasicMaterial({ map: texture });
    loading.style.display = "none";
    hintTimer = setTimeout(function(){ hint.classList.add("hidden"); }, 3000);
}, undefined, function() {
    loading.innerHTML = '<div style="color:#f44;font-size:14px">Failed to load image</div>';
});

/* --- Render --- */
function animate() {
    requestAnimationFrame(animate);
    var phi = THREE.MathUtils.degToRad(90 - lat);
    var theta = THREE.MathUtils.degToRad(lon);
    camera.lookAt(new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi) * Math.sin(theta)
    ));
    renderer.render(scene, camera);
}
animate();

/* --- Resize --- */
window.addEventListener("resize", function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- Mouse --- */
canvas.addEventListener("mousedown", function(e) {
    isDragging = true;
    prevX = e.clientX;
    prevY = e.clientY;
    hideHint();
});
document.addEventListener("mousemove", function(e) {
    if (!isDragging) return;
    lon -= (e.clientX - prevX) * 0.2;
    lat += (e.clientY - prevY) * 0.2;
    lat = Math.max(-85, Math.min(85, lat));
    prevX = e.clientX;
    prevY = e.clientY;
});
document.addEventListener("mouseup", function() { isDragging = false; });

/* --- Touch --- */
var touchPrevX = 0, touchPrevY = 0;
var touchStartDist = 0, touchStartFov = 75;
canvas.addEventListener("touchstart", function(e) {
    e.preventDefault();
    hideHint();
    if (e.touches.length === 1) {
        isDragging = true;
        touchPrevX = e.touches[0].clientX;
        touchPrevY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        isDragging = false;
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.sqrt(dx * dx + dy * dy);
        touchStartFov = camera.fov;
    }
}, { passive: false });
canvas.addEventListener("touchmove", function(e) {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
        lon -= (e.touches[0].clientX - touchPrevX) * 0.2;
        lat += (e.touches[0].clientY - touchPrevY) * 0.2;
        lat = Math.max(-85, Math.min(85, lat));
        touchPrevX = e.touches[0].clientX;
        touchPrevY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var newFov = touchStartFov * (touchStartDist / dist);
        camera.fov = Math.max(30, Math.min(120, newFov));
        camera.updateProjectionMatrix();
        fovRange.value = camera.fov;
        fovVal.textContent = Math.round(camera.fov) + "\u00b0";
    }
}, { passive: false });
canvas.addEventListener("touchend", function() { isDragging = false; });

/* --- Wheel (FOV) --- */
canvas.addEventListener("wheel", function(e) {
    e.preventDefault();
    camera.fov = Math.max(30, Math.min(120, camera.fov + e.deltaY * 0.05));
    camera.updateProjectionMatrix();
    fovRange.value = camera.fov;
    fovVal.textContent = Math.round(camera.fov) + "\u00b0";
}, { passive: false });

/* --- FOV slider --- */
fovRange.addEventListener("input", function() {
    camera.fov = Number(this.value);
    camera.updateProjectionMatrix();
    fovVal.textContent = Math.round(camera.fov) + "\u00b0";
});

/* --- Buttons --- */
document.getElementById("fs-btn").addEventListener("click", function() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
    } else {
        document.exitFullscreen();
    }
});

function hideHint() {
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
    hint.classList.add("hidden");
}

})();
</script>
